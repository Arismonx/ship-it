#
# Labels as code (docs/design/workflows.md §9), dogfooding: when
# .github/ship.json changes on main, `ship sync --yes` brings the GitHub
# labels in line with it (create, rename, recolour; never deletes). ship is
# built from main itself and reads the job token from GH_TOKEN.
name: labels

on:
  push:
    branches: [main]
    paths: [".github/ship.json"]
  workflow_dispatch:

# Nothing by default; the job asks for what it needs.
permissions: {}

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  sync:
    name: sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # create and update the repository's labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/ship sync --yes
