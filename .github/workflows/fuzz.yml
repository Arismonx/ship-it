#
# Weekly long fuzzing (docs/design/workflows.md §8): every Fuzz target, found by
# `go test -list` (go run ./tools/fuzz -list), runs 10 minutes in its own job;
# pull requests only fuzz 10 seconds (ci.yml). A failing target uploads its
# failing inputs and corpus as the artifact fuzz-<target>, and one issue per
# failing target is opened (or commented on if already open) by a job that
# can write issues but runs no repository code.
# Cost: about 14 targets × ~12 min ≈ 170 Linux minutes a week (free on a
# public repository; ~700 of the 2,000 monthly minutes of GitHub Free on a
# private one).
name: fuzz

on:
  schedule:
    - cron: "13 3 * * 0"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to fuzz each target (Go duration)
        default: 10m

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  targets:
    name: list targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: list
        id: list
        run: echo "targets=$(go run ./tools/fuzz -list)" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.name }}
    needs: targets
    runs-on: ubuntu-latest
    # 10 minutes of fuzzing, plus build and a margin; far below the 6 h limit.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # GitHub Free allows 20 concurrent jobs: leave room for the other workflows.
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: fuzz
        env:
          PACKAGE: ${{ matrix.package }}
          NAME: ${{ matrix.name }}
          FUZZTIME: ${{ inputs.fuzztime || '10m' }}
        run: go run ./tools/fuzz -run -package "$PACKAGE" -name "$NAME" -time "$FUZZTIME" -out "$RUNNER_TEMP/fuzz-report"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.name }}
          path: ${{ runner.temp }}/fuzz-report
          if-no-files-found: ignore
          retention-days: 30

  issues:
    name: open issues
    needs: fuzz
    if: always() && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # open or comment on one issue per failing target
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-*
          path: ${{ runner.temp }}/reports
      - name: open or comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in "$RUNNER_TEMP"/reports/fuzz-*/; do
            [ -f "$dir/title.txt" ] || continue
            title="$(head -n 1 "$dir/title.txt")"
            { cat "$dir/report.md"; printf '\nRun and artifacts: %s\n' "$RUN_URL"; } > "$dir/body.md"
            number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$dir/body.md"
            else
              gh issue create --title "$title" --body-file "$dir/body.md"
            fi
          done
